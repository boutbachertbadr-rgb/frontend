<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vazlina Product Page Colors</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Inter,Arial; padding:20px; background:#f0f0f0; }
.v { margin-bottom:40px; border:2px solid #ccc; border-radius:12px; overflow:hidden; }
.vt { padding:12px 20px; font-weight:bold; font-size:15px; color:white; }
.ann { padding:8px; text-align:center; font-size:12px; color:white; }
.main { display:flex; gap:20px; padding:24px; }
.gallery { width:260px; }
.gmain { width:100%; height:220px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:64px; }
.thumbs { display:flex; gap:8px; margin-top:10px; }
.th { width:60px; height:60px; border-radius:8px; border:2px solid transparent; display:flex; align-items:center; justify-content:center; font-size:20px; }
.th.active { border-color:#888; }
.info { flex:1; }
.info .pill { display:inline-block; padding:3px 10px; border-radius:50px; font-size:11px; margin-bottom:8px; }
.info h1 { font-size:22px; margin-bottom:6px; }
.info .sub { font-size:13px; color:#666; margin-bottom:12px; }
.info .rating { font-size:13px; color:#666; margin-bottom:14px; }
.tier { border:1px solid #ddd; border-radius:12px; padding:12px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center; }
.tier.pop { border-width:2px; }
.tier .tname { font-weight:bold; font-size:14px; }
.tier .tprice { font-weight:bold; font-size:16px; }
.tier .tsave { font-size:12px; }
.cta { width:100%; padding:14px; border:none; border-radius:8px; font-size:15px; font-weight:bold; color:white; margin:10px 0; cursor:pointer; }
.trust { display:flex; gap:10px; flex-wrap:wrap; margin:10px 0; }
.trust span { font-size:12px; padding:4px 10px; border-radius:50px; border:1px solid #ddd; }

.feat { padding:24px; text-align:center; }
.feat h2 { font-size:11px; text-transform:uppercase; letter-spacing:2px; margin-bottom:6px; }
.feat h3 { font-size:20px; margin-bottom:16px; }
.fgrid { display:flex; gap:14px; justify-content:center; }
.fcard { width:180px; border-radius:12px; padding:14px; text-align:left; }
.fcard h4 { font-size:14px; margin-bottom:4px; }
.fcard p { font-size:12px; color:#666; }

.timeline { padding:24px; text-align:center; }
.timeline h2 { font-size:11px; text-transform:uppercase; letter-spacing:2px; margin-bottom:6px; }
.timeline h3 { font-size:20px; margin-bottom:16px; }
.tlrow { display:flex; gap:14px; justify-content:center; }
.tlcard { width:170px; border-radius:12px; padding:14px; text-align:center; }
.tlnum { width:36px; height:36px; border-radius:50%; color:white; display:flex; align-items:center; justify-content:center; font-weight:bold; margin:0 auto 8px; }

.bn { padding:24px; text-align:center; }
.bn .bl { font-size:11px; text-transform:uppercase; letter-spacing:2px; margin-bottom:6px; }
.bn .bh { font-size:20px; font-weight:bold; color:white; margin-bottom:4px; }
.bn .bs { font-size:14px; color:rgba(255,255,255,0.8); margin-bottom:14px; }
.bn .bb { border:none; padding:10px 24px; border-radius:50px; font-size:13px; font-weight:bold; cursor:pointer; }

/* F */
.vf .vt { background:#1C1C1E; }
.vf .ann { background:#1C1C1E; }
.vf .main { background:#FAF5F5; }
.vf .gmain { background:linear-gradient(135deg,#F0E8E8,#E0D4D4); }
.vf .th { background:linear-gradient(135deg,#F0E8E8,#E0D4D4); }

.vf .tier.pop { border-color:#D4A5A5; background:#FFF5F5; }

.vf .feat { background:#FAF5F5; }

.vf .fcard { background:white; border:1px solid #E8E0E0; }
.vf .timeline { background:#FAF5F5; }

.vf .timeline h3 { color:#1C1C1E; }
