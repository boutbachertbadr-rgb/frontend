<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Vazlina Homepage Colors</title>
<style>
* { margin:0; padding:0; box-sizing:border-box; }
body { font-family:Inter,Arial; padding:20px; background:#f0f0f0; }
.v { margin-bottom:40px; border:2px solid #ccc; border-radius:12px; overflow:hidden; }
.vt { padding:12px 20px; font-weight:bold; font-size:15px; color:white; }
.vb { padding:0; }
.ann { padding:8px; text-align:center; font-size:12px; color:white; }
.nav { padding:12px 20px; display:flex; justify-content:space-between; background:white; }
.hero { display:flex; gap:20px; padding:30px 20px; }
.hi { width:180px; height:140px; border-radius:12px; display:flex; align-items:center; justify-content:center; font-size:48px; }
.ht h1 { font-size:22px; margin-bottom:6px; }
.ht p { font-size:13px; margin-bottom:14px; }
.btn { border:none; padding:10px 22px; border-radius:50px; font-size:13px; cursor:pointer; margin-right:6px; }
.prod { padding:30px 20px; text-align:center; }
.prod h2 { font-size:11px; text-transform:uppercase; letter-spacing:2px; margin-bottom:6px; }
.prod h3 { font-size:20px; margin-bottom:20px; }
.cards { display:flex; gap:14px; justify-content:center; }
.c { width:170px; border-radius:12px; padding:12px; text-align:left; }
.c .tag { display:inline-block; padding:2px 8px; border-radius:50px; font-size:10px; margin-bottom:6px; }
.c .ci { width:100%; height:90px; border-radius:8px; display:flex; align-items:center; justify-content:center; font-size:36px; margin-bottom:8px; }
.c .cn { font-weight:bold; font-size:14px; }
.c .cp { font-size:12px; margin-top:2px; }
.c .st { font-size:12px; margin-top:4px; }
.bn { padding:30px 20px; text-align:center; }
.bn .bl { font-size:11px; text-transform:uppercase; letter-spacing:2px; margin-bottom:6px; }
.bn .bh { font-size:20px; font-weight:bold; color:white; margin-bottom:4px; }
.bn .bs { font-size:14px; color:rgba(255,255,255,0.8); margin-bottom:14px; }
.bn .bb { border:none; padding:10px 24px; border-radius:50px; font-size:13px; font-weight:bold; cursor:pointer; }

/* F: Charcoal + Rose Gold */
.vf .vt { background:#1C1C1E; }
.vf .ann { background:#1C1C1E; }
.vf .nav .logo { color:#1C1C1E; font-weight:bold; }
.vf .hero { background:#FAF5F5; }
.vf .hi { background:linear-gradient(135deg,#F0E8E8,#E0D4D4); }
.vf .ht h1 { color:#1C1C1E; }
.vf .ht p { color:#6B6B6B; }
.vf .btn-p { background:#1C1C1E; color:white; }
.vf .btn-s { background:white; color:#1C1C1E; border:1px solid #ddd; }
.vf .prod { background:#FAF5F5; }
.vf .prod h2 { color:#D4A5A5; }
.vf .prod h3 { color:#1C1C1E; }
.vf .c { background:white; border:1px solid #E8E0E0; }
.vf .c .tag { background:white; border:1px solid #E8E0E0; color:#1C1C1E; }
.vf .c .ci { background:linear-gradient(135deg,#F0E8E8,#E0D4D4); }
.vf .c .cp { color:#6B6B6B; }
.vf .c .st { color:#D4A5A5; }
.vf .bn { background:#1C1C1E; }
.vf .bn .bl { color:#D4A5A5; }
.vf .bn .bb { background:#D4A5A5; color:#1C1C1E; }

<h2 style="text-align:center; margin-bottom:8px;">Vazlina Homepage — 5 Color Variants</h2>
<p style="text-align:center; color:#666; margin-bottom:24px; font-size:13px;">Scroll to compare. All show: Announcement, Nav, Hero, Product Cards, CTA Banner.</p>

<script>

  {cls:'vf',name:'F: Charcoal + Rose Gold',pri:'#1C1C1E',acc:'#D4A5A5'},

  document.write(`

          <div class="c"><div class="tag">Carga Inteligente</div><div class="ci">&#128267;</div><div class="cn">Cargador Guardian</div><div class="cp">Desde $502.99 MXN</div><div class="st">&#9733;&#9733;&#9733;&#9733;&#9733; (198)</div></div>
          <div class="c"><div class="tag">Estilo Inalambrico</div><div class="ci">&#127912;</div><div class="cn">Auriculares Mariposa</div><div class="cp">Desde $630.99 MXN</div><div class="st">&#9733;&#9733;&#9733;&#9733;&#9733; (412)</div></div>
        </div>

      <div class="bn">
